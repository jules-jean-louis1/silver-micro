version: "3.9"

x-project-defaults: &project_defaults
  networks:
    - default
  env_file: ./.env
services:
  app:
    <<: *project_defaults
    build:
      context: ../app
      dockerfile: Dockerfile
    image: silver-micro-app:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 10s
      retries: 3
    ports:
      - "3000:3000"

  db:
    <<: *project_defaults
    build:
      context: ../database
      dockerfile: Dockerfile
    image: silver-micro-db:latest
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: